<link rel="stylesheet" href="css/style.css">
<style>
  .lost { min-height: calc(100vh - 140px); display: grid; align-content: center; padding-block: 56px; }
  .lost .wrap { display: grid; gap: 18px; justify-items: start; }
  .b4 { font-family: var(--f-display); font-size: clamp(120px, 30vw, 260px); line-height: .85; margin: 0; color: var(--rock); letter-spacing: -.03em; }
  .lost p { margin: 0; max-width: 30em; }
  .scene404 { position: relative; width: 220px; height: 150px; max-width: 100%; }
  .scene404 .leaf { position: absolute; left: 112px; top: 18px; width: 34px; height: 30px; background: var(--moss); clip-path: polygon(0 100%, 100% 0, 45% 100%); transform-origin: 0 100%; animation: peek 5s ease-in-out infinite; }
  .scene404 .rock { position: absolute; inset: 40px 0 0; background: linear-gradient(120deg, #4a4068 0 40%, #3a3254 40% 70%, #2f2846 70%); clip-path: polygon(8% 100%, 18% 22%, 48% 0, 80% 12%, 96% 60%, 100% 100%); }
  @keyframes peek { 0%, 70%, 100% { transform: translateY(14px); } 78%, 92% { transform: translateY(0) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .scene404 .leaf { animation: none; transform: translateY(6px); } }
</style>
</head>
